version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Build completed"
      - ls -la
artifacts:
  files:
    - '**/*'
  base-directory: '.'
  name: flask-app-$(date +%Y-%m-%d)